<!-- Sidebar (Desktop & Mobile Drawer) -->
<aside id="sidebarDrawer" class="fixed md:static inset-y-0 left-0 w-80 md:w-80 bg-white border-r border-slate-200 flex flex-col justify-between flex-shrink-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl md:shadow-none h-full max-h-screen">
  <div class="flex flex-col flex-1 min-h-0">
    <!-- Header / Logo -->
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-sm tracking-tight">DocPortal</h1>
          <p class="text-[11px] text-slate-400 font-medium">Konversi Internal Kantor</p>
        </div>
      </div>
      <button onclick="closeMobileMenu()" class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Navigation Tools (Scrollable container) -->
    <div class="p-3 space-y-4 overflow-y-auto flex-1">
      
      <!-- Beranda / Dashboard -->
      <div class="space-y-1">
        <p class="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Beranda</p>

        <button onclick="selectTool('dashboard')" id="btn-dashboard" class="nav-item active">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate font-semibold">Dashboard Utama</span>
              <span class="badge badge-indigo ml-1">Portal</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Semua alat & ringkasan</p>
          </div>
        </button>
      </div>

      <!-- Category 1: Dokumen & Spreadsheet -->
      <div class="space-y-1">
        <p class="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Dokumen & Kantor</p>

        <button onclick="selectTool('htmlToExcel')" id="btn-htmlToExcel" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">HTML ke Excel</span>
              <span class="badge badge-indigo ml-1">xlsx</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Ekstrak tabel & card web</p>
          </div>
        </button>

        <button onclick="selectTool('csvToExcel')" id="btn-csvToExcel" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">CSV ke Excel</span>
              <span class="badge badge-emerald ml-1">xlsx</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Auto-detect delimiter</p>
          </div>
        </button>

        <button onclick="selectTool('pdfToWord')" id="btn-pdfToWord" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">PDF ke Word</span>
              <span class="badge badge-rose ml-1">docx</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Digital, OCR & Hybrid</p>
          </div>
        </button>

        <button onclick="selectTool('wordToPdf')" id="btn-wordToPdf" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">Word ke PDF</span>
              <span class="badge badge-blue ml-1">pdf</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Presisi LibreOffice 100%</p>
          </div>
        </button>

        <button onclick="selectTool('pdfToPpt')" id="btn-pdfToPpt" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">PDF ke PPT</span>
              <span class="badge badge-orange ml-1">pptx</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Presentasi PowerPoint</p>
          </div>
        </button>
      </div>

      <!-- Category 2: Gambar & Media -->
      <div class="space-y-1">
        <p class="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Gambar & Media</p>

        <button onclick="selectTool('pdfToImage')" id="btn-pdfToImage" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">PDF ke Gambar</span>
              <span class="badge badge-purple ml-1">img/zip</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">PNG / JPG (Semua / Pilihan)</p>
          </div>
        </button>

        <button onclick="selectTool('imageToPdf')" id="btn-imageToPdf" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">Gambar ke PDF</span>
              <span class="badge badge-teal ml-1">pdf</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Gabung JPG/PNG jadi PDF</p>
          </div>
        </button>
      </div>

      <!-- Category 3: Pengelola Halaman PDF -->
      <div class="space-y-1">
        <p class="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pengelola File PDF</p>

        <button onclick="selectTool('mergePdf')" id="btn-mergePdf" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">Gabung PDF</span>
              <span class="badge badge-indigo ml-1">canvas</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Geser urutan thumbnail</p>
          </div>
        </button>

        <button onclick="selectTool('splitPdf')" id="btn-splitPdf" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">Pisah PDF</span>
              <span class="badge badge-cyan ml-1">pisah</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Per lembar / rentang</p>
          </div>
        </button>

        <button onclick="selectTool('pageManager')" id="btn-pageManager" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">Kelola Halaman</span>
              <span class="badge badge-amber ml-1">visual</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Geser, putar 90° & buang</p>
          </div>
        </button>

        <button onclick="selectTool('compressPdf')" id="btn-compressPdf" class="nav-item">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
          </svg>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="truncate">Kompres PDF</span>
              <span class="badge badge-emerald ml-1">preview mb</span>
            </div>
            <p class="text-[11px] text-slate-400 font-normal truncate">Kecilkan ukuran file</p>
          </div>
        </button>
      </div>

    </div>
  </div>

  <!-- Security Bottom Banner -->
  <div class="p-4 border-t border-slate-100 flex-shrink-0">
    <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-3">
      <div class="flex items-center gap-2 mb-1">
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
        </svg>
        <span class="text-xs font-bold text-emerald-800">100% Offline & Aman</span>
      </div>
      <p class="text-[11px] text-emerald-700 leading-tight">Data diproses di RAM komputer tanpa koneksi internet.</p>
    </div>
  </div>
</aside>
